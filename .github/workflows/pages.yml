name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy copy with secret injected (never written to the repo)
        env:
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os
          import shutil

          SKIP = {".git", ".github", "_site"}

          def ignore(dir_path, names):
              if os.path.abspath(dir_path) == os.path.abspath("."):
                  return [n for n in names if n in SKIP]
              return []

          shutil.rmtree("_site", ignore_errors=True)
          shutil.copytree(".", "_site", ignore=ignore)

          path = os.path.join("_site", "access", "access-gate.js")
          placeholder = "__ISSUES_TOKEN__"
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()
          if placeholder not in src:
              raise SystemExit("Expected placeholder " + placeholder + " not found in " + path)
          token = os.environ.get("ISSUES_TOKEN", "")
          if not token:
              raise SystemExit("ISSUES_TOKEN secret is empty")
          src = src.replace(placeholder, token)
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
