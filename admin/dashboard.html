<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash - Access Control Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
      font-family: "Times New Roman", Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    .header {
      background: #ffffff;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      font-size: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-weight: bold;
      font-size: 15px;
    }

    .field input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 11px 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .field input:focus {
      border-color: #2563eb;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .msg {
      margin-top: 12px;
      font-size: 15px;
      min-height: 20px;
    }

    .msg.ok {
      color: #15803d;
    }

    .msg.err {
      color: #dc2626;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 13px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: right;
      vertical-align: middle;
    }

    th {
      background: #f8fafc;
      font-weight: bold;
    }

    tr:hover td {
      background: #fafafa;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .status-allowed {
      background: #dcfce7;
      color: #166534;
    }

    .status-blocked {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-new {
      background: #fef3c7;
      color: #92400e;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #6b7280;
    }

    .small {
      color: #6b7280;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .counter {
      font-size: 15px;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 15px;
        padding: 0 12px 30px;
      }

      .header,
      .card {
        border-radius: 14px;
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>لوحة التحكم - المستخدمون</h1>
    <p>
      إدارة صلاحيات الدخول إلى نظام Cash
    </p>
  </div>

  <!-- GitHub Settings -->
  <div class="card">
    <h2>إعدادات الاتصال</h2>

    <div class="form-grid">

      <div class="field">
        <label for="owner">GitHub Owner</label>
        <input id="owner" type="text" placeholder="fadiRamzy">
      </div>

      <div class="field">
        <label for="repo">Repository</label>
        <input id="repo" type="text" placeholder="cash">
      </div>

      <div class="field">
        <label for="branch">Branch</label>
        <input id="branch" type="text" value="main">
      </div>

      <div class="field">
        <label for="token">Admin Token</label>
        <input id="token" type="password" placeholder="أدخل Admin Token">
      </div>

    </div>

    <div class="actions">
      <button class="btn-primary" id="connectBtn" onclick="connectGitHub()">
        اتصال
      </button>

      <button class="btn-secondary" id="refreshBtn" onclick="refreshAll()" disabled>
        تحديث
      </button>
    </div>

    <div id="connectionMsg" class="msg"></div>
  </div>


  <!-- Users -->
  <div class="card">

    <div class="top-actions">
      <div>
        <h2 style="margin-bottom:5px;">المستخدمون</h2>
        <div class="counter" id="usersCounter"></div>
      </div>

      <button class="btn-secondary" onclick="refreshAll()" id="refreshUsersBtn" disabled>
        ↻ تحديث المستخدمين
      </button>
    </div>

    <div id="usersMsg" class="msg"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>اسم المستخدم</th>
            <th>الحالة</th>
            <th>تاريخ الإضافة / الدخول</th>
            <th>الإجراء</th>
          </tr>
        </thead>

        <tbody id="usersTableBody">
          <tr>
            <td colspan="4" class="empty">
              قم بالاتصال أولاً.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>


  <!-- New Login Issues -->
  <div class="card">

    <div class="top-actions">
      <div>
        <h2 style="margin-bottom:5px;">محاولات الدخول الجديدة</h2>
        <div class="counter" id="issuesCounter"></div>
      </div>

      <button class="btn-secondary" onclick="refreshAll()" id="refreshIssuesBtn" disabled>
        ↻ تحديث
      </button>
    </div>

    <div id="issuesMsg" class="msg"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>اسم المستخدم</th>
            <th>التاريخ</th>
            <th>رقم Issue</th>
            <th>الإجراء</th>
          </tr>
        </thead>

        <tbody id="issuesTableBody">
          <tr>
            <td colspan="4" class="empty">
              لا توجد بيانات.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>


<script>
(function () {

  "use strict";

  var state = {
    owner: "",
    repo: "",
    branch: "main",
    token: "",
    usersSha: null,
    users: {},
    issues: [],
    connected: false
  };


  /* =========================================================
     Helpers
  ========================================================= */

  function $(id) {
    return document.getElementById(id);
  }


  function setMsg(id, text, type) {
    var el = $(id);

    if (!el) return;

    el.textContent = text || "";
    el.className = "msg" + (type ? " " + type : "");
  }


  function api(path) {
    return "https://api.github.com/repos/" +
      encodeURIComponent(state.owner) +
      "/" +
      encodeURIComponent(state.repo) +
      path;
  }


  function authHeaders(extra) {

    var headers = {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + state.token,
      "X-GitHub-Api-Version": "2022-11-28"
    };

    if (extra) {
      Object.keys(extra).forEach(function (key) {
        headers[key] = extra[key];
      });
    }

    return headers;
  }


  function b64EncodeUtf8(str) {

    return btoa(
      unescape(
        encodeURIComponent(str)
      )
    );

  }


  function b64DecodeUtf8(str) {

    return decodeURIComponent(
      escape(
        atob(str.replace(/\n/g, ""))
      )
    );

  }


  function safeJsonParse(text) {

    try {
      return JSON.parse(text);
    } catch (e) {
      return {};
    }

  }


  /* =========================================================
     GitHub Connection
  ========================================================= */

  window.connectGitHub = function () {

    state.owner = $("owner").value.trim();
    state.repo = $("repo").value.trim();
    state.branch = $("branch").value.trim() || "main";
    state.token = $("token").value.trim();

    if (!state.owner || !state.repo || !state.token) {

      setMsg(
        "connectionMsg",
        "من فضلك أدخل Owner و Repository و Admin Token.",
        "err"
      );

      return;
    }

    setMsg(
      "connectionMsg",
      "جارٍ الاتصال بـ GitHub...",
      ""
    );

    $("connectBtn").disabled = true;

    loadUsers()
      .then(function () {
        return loadIssues();
      })
      .then(function () {

        state.connected = true;

        $("refreshBtn").disabled = false;
        $("refreshUsersBtn").disabled = false;
        $("refreshIssuesBtn").disabled = false;

        renderUsers();
        renderIssues(state.issues);

        setMsg(
          "connectionMsg",
          "تم الاتصال بنجاح.",
          "ok"
        );

      })
      .catch(function (e) {

        state.connected = false;

        $("refreshBtn").disabled = true;
        $("refreshUsersBtn").disabled = true;
        $("refreshIssuesBtn").disabled = true;

        setMsg(
          "connectionMsg",
          "فشل الاتصال: " + e.message,
          "err"
        );

      })
      .finally(function () {
        $("connectBtn").disabled = false;
      });

  };


  /* =========================================================
     Load users.json
  ========================================================= */

  function loadUsers() {

    var url =
      api(
        "/contents/users.json?ref=" +
        encodeURIComponent(state.branch) +
        "&_=" +
        Date.now()
      );

    return fetch(url, {
      method: "GET",
      cache: "no-store",
      headers: authHeaders({
        "Cache-Control": "no-cache"
      })
    })

    .then(function (r) {

      if (!r.ok) {

        if (r.status === 404) {
          throw new Error("users.json غير موجود.");
        }

        return r.text().then(function (txt) {

          throw new Error(
            "HTTP " +
            r.status +
            (txt ? " - " + txt : "")
          );

        });

      }

      return r.json();

    })

    .then(function (data) {

      if (!data.content) {
        throw new Error("تعذر قراءة users.json.");
      }

      state.usersSha = data.sha;

      var decoded = b64DecodeUtf8(data.content);

      var parsed = safeJsonParse(decoded);

      if (!parsed || typeof parsed !== "object") {
        parsed = {};
      }

      state.users = parsed;

      return state.users;

    });

  }


  /* =========================================================
     Load open login Issues
  ========================================================= */

  function loadIssues() {

    var url =
      api(
        "/issues?state=open&labels=&per_page=100&sort=created&direction=desc&_=" +
        Date.now()
      );

    return fetch(url, {
      method: "GET",
      cache: "no-store",
      headers: authHeaders({
        "Cache-Control": "no-cache"
      })
    })

    .then(function (r) {

      if (!r.ok) {

        return r.text().then(function (txt) {

          throw new Error(
            "HTTP " +
            r.status +
            (txt ? " - " + txt : "")
          );

        });

      }

      return r.json();

    })

    .then(function (list) {

      if (!Array.isArray(list)) {
        list = [];
      }

      state.issues = list.filter(function (issue) {

        return (
          !issue.pull_request &&
          /^New login: /.test(issue.title || "")
        );

      });

      return state.issues;

    });

  }


  /* =========================================================
     Get username from Issue
  ========================================================= */

  function getIssueUsername(issue) {

    var title = issue && issue.title
      ? issue.title
      : "";

    return title.replace(/^New login:\s*/, "").trim();

  }


  /* =========================================================
     Find latest open Issue for username
  ========================================================= */

  function getPendingIssueByName(username) {

    var normalized = String(username || "")
      .trim()
      .toLowerCase();

    for (var i = 0; i < state.issues.length; i++) {

      var issueUsername =
        getIssueUsername(state.issues[i])
          .toLowerCase();

      if (issueUsername === normalized) {
        return state.issues[i];
      }

    }

    return null;

  }


  /* =========================================================
     Normalize users
  ========================================================= */

  function normalizeUserRecord(value) {

    if (typeof value === "string") {

      return {
        status: value,
        createdAt: ""
      };

    }

    if (!value || typeof value !== "object") {

      return {
        status: "allowed",
        createdAt: ""
      };

    }

    return {
      status: value.status || "allowed",
      createdAt: value.createdAt || value.date || ""
    };

  }


  /* =========================================================
     Save users.json
     
     IMPORTANT:
     Before every PUT, fetch the latest users.json SHA.
     This prevents:
     "users.json does not match SHA"
  ========================================================= */

  function saveUsers(message) {

    var latestUrl =
      api(
        "/contents/users.json?ref=" +
        encodeURIComponent(state.branch) +
        "&_=" +
        Date.now()
      );

    return fetch(latestUrl, {
      method: "GET",
      cache: "no-store",
      headers: authHeaders({
        "Cache-Control": "no-cache"
      })
    })

    .then(function (r) {

      if (!r.ok) {

        return r.text().then(function (txt) {

          throw new Error(
            "تعذر الحصول على أحدث نسخة من users.json: HTTP " +
            r.status +
            (txt ? " - " + txt : "")
          );

        });

      }

      return r.json();

    })

    .then(function (latest) {

      if (!latest || !latest.sha) {
        throw new Error("لم يتم العثور على SHA الحالي لـ users.json.");
      }

      state.usersSha = latest.sha;

      var body = {
        message: message || "Update users.json",
        content: b64EncodeUtf8(
          JSON.stringify(state.users, null, 2)
        ),
        branch: state.branch,
        sha: state.usersSha
      };

      return fetch(
        api("/contents/users.json"),
        {
          method: "PUT",
          headers: authHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify(body)
        }
      );

    })

    .then(function (r) {

      if (!r.ok) {

        return r.json()
          .catch(function () {
            return {};
          })
          .then(function (j) {

            throw new Error(
              j.message ||
              ("HTTP " + r.status)
            );

          });

      }

      return r.json();

    })

    .then(function (result) {

      if (
        result &&
        result.content &&
        result.content.sha
      ) {

        state.usersSha =
          result.content.sha;

      }

    });

  }


  /* =========================================================
     Close Issue
  ========================================================= */

  function closeIssue(issueNumber) {

    if (!issueNumber) {
      return Promise.resolve();
    }

    return fetch(
      api("/issues/" + encodeURIComponent(issueNumber)),
      {
        method: "PATCH",
        headers: authHeaders({
          "Content-Type": "application/json"
        }),
        body: JSON.stringify({
          state: "closed"
        })
      }
    )

    .then(function (r) {

      if (!r.ok) {

        return r.json()
          .catch(function () {
            return {};
          })
          .then(function (j) {

            throw new Error(
              j.message ||
              ("فشل إغلاق Issue - HTTP " + r.status)
            );

          });

      }

      return r.json();

    });

  }


  /* =========================================================
     Set User Status
  ========================================================= */

  function setUserStatus(username, status, issue) {

    username = String(username || "").trim();

    if (!username) {
      return Promise.reject(
        new Error("اسم المستخدم غير صحيح.")
      );
    }

    if (
      status !== "allowed" &&
      status !== "blocked"
    ) {

      return Promise.reject(
        new Error("حالة المستخدم غير صحيحة.")
      );

    }

    var previous =
      Object.prototype.hasOwnProperty.call(
        state.users,
        username
      )
        ? state.users[username]
        : null;

    state.users[username] = {
      status: status,
      createdAt:
        previous &&
        typeof previous === "object" &&
        previous.createdAt
          ? previous.createdAt
          : new Date().toISOString()
    };

    var message =
      status === "allowed"
        ? "Allow user: " + username
        : "Block user: " + username;

    return saveUsers(message)
      .then(function () {

        if (issue && issue.number) {
          return closeIssue(issue.number);
        }

      });

  }


  /* =========================================================
     Allow User
  ========================================================= */

  window.allowUser = function (username, issueNumber) {

    var issue =
      issueNumber
        ? state.issues.find(function (i) {
            return String(i.number) === String(issueNumber);
          })
        : getPendingIssueByName(username);

    var button =
      event && event.target
        ? event.target
        : null;

    if (button) {
      button.disabled = true;
    }

    setMsg(
      "usersMsg",
      "جارٍ السماح للمستخدم: " + username + "...",
      ""
    );

    setUserStatus(
      username,
      "allowed",
      issue
    )

    .then(function () {

      setMsg(
        "usersMsg",
        "تم السماح للمستخدم: " + username,
        "ok"
      );

      return refreshAll();

    })

    .catch(function (e) {

      setMsg(
        "usersMsg",
        "فشل السماح: " + e.message,
        "err"
      );

      if (button) {
        button.disabled = false;
      }

    });

  };


  /* =========================================================
     Block User
  ========================================================= */

  window.blockUser = function (username, issueNumber) {

    var issue =
      issueNumber
        ? state.issues.find(function (i) {
            return String(i.number) === String(issueNumber);
          })
        : getPendingIssueByName(username);

    var button =
      event && event.target
        ? event.target
        : null;

    if (button) {
      button.disabled = true;
    }

    setMsg(
      "usersMsg",
      "جارٍ حظر المستخدم: " + username + "...",
      ""
    );

    setUserStatus(
      username,
      "blocked",
      issue
    )

    .then(function () {

      setMsg(
        "usersMsg",
        "تم حظر المستخدم: " + username,
        "ok"
      );

      return refreshAll();

    })

    .catch(function (e) {

      setMsg(
        "usersMsg",
        "فشل الحظر: " + e.message,
        "err"
      );

      if (button) {
        button.disabled = false;
      }

    });

  };


  /* =========================================================
     Render Users
     
     Users = users.json + open login Issues
     
     Therefore new usernames automatically appear in
     "المستخدمون" after Refresh.
  ========================================================= */

  function renderUsers() {

    var body = $("usersTableBody");

    var merged = {};

    /* Existing users.json users */

    Object.keys(state.users || {})
      .forEach(function (username) {

        merged[username] = {
          username: username,
          source: "users",
          record: normalizeUserRecord(
            state.users[username]
          ),
          issue: null
        };

      });


    /* New usernames from open Issues */

    (state.issues || [])
      .forEach(function (issue) {

        var username =
          getIssueUsername(issue);

        if (!username) return;

        var existing =
          Object.keys(merged).find(function (name) {
            return name.toLowerCase() ===
              username.toLowerCase();
          });

        if (!existing) {

          merged[username] = {
            username: username,
            source: "issue",
            record: {
              status: "new",
              createdAt:
                issue.created_at || ""
            },
            issue: issue
          };

        } else {

          merged[existing].issue = issue;

        }

      });


    var names =
      Object.keys(merged).sort(function (a, b) {
        return a.localeCompare(
          b,
          "en",
          { sensitivity: "base" }
        );
      });


    $("usersCounter").textContent =
      "إجمالي المستخدمين الظاهرين: " +
      names.length;


    if (!names.length) {

      body.innerHTML =
        '<tr>' +
          '<td colspan="4" class="empty">' +
            'لا يوجد مستخدمون حتى الآن.' +
          '</td>' +
        '</tr>';

      return;
    }


    body.innerHTML = names.map(function (username) {

      var item = merged[username];

      var record = item.record;

      var status =
        record.status || "allowed";

      var statusHtml = "";

      var actionHtml = "";


      if (status === "allowed") {

        statusHtml =
          '<span class="status status-allowed">' +
            'مسموح' +
          '</span>';

        actionHtml =
          '<button class="btn-danger" ' +
            'onclick="blockUser(' +
              escapeJs(username) +
            ', null)">' +
            'حظر' +
          '</button>';

      }

      else if (status === "blocked") {

        statusHtml =
          '<span class="status status-blocked">' +
            'محظور' +
          '</span>';

        actionHtml =
          '<button class="btn-success" ' +
            'onclick="allowUser(' +
              escapeJs(username) +
            ', null)">' +
            'سماح' +
          '</button>';

      }

      else {

        statusHtml =
          '<span class="status status-new">' +
            'جديد - غير مُراجع' +
          '</span>';

        var issueNumber =
          item.issue
            ? item.issue.number
            : "";

        actionHtml =
          '<div style="display:flex;gap:7px;flex-wrap:wrap;">' +

            '<button class="btn-success" ' +
              'onclick="allowUser(' +
                escapeJs(username) +
                ',' +
                JSON.stringify(issueNumber) +
              ')">' +
              'سماح' +
            '</button>' +

            '<button class="btn-danger" ' +
              'onclick="blockUser(' +
                escapeJs(username) +
                ',' +
                JSON.stringify(issueNumber) +
              ')">' +
              'حظر' +
            '</button>' +

          '</div>';

      }


      var date =
        item.issue && item.issue.created_at
          ? formatDate(item.issue.created_at)
          : record.createdAt
            ? formatDate(record.createdAt)
            : "-";


      return (
        '<tr>' +

          '<td>' +
            escapeHtml(username) +
          '</td>' +

          '<td>' +
            statusHtml +
          '</td>' +

          '<td>' +
            escapeHtml(date) +
          '</td>' +

          '<td>' +
            actionHtml +
          '</td>' +

        '</tr>'
      );

    }).join("");

  }


  /* =========================================================
     Render Issues
  ========================================================= */

  function renderIssues(list) {

    var body = $("issuesTableBody");

    list = Array.isArray(list)
      ? list
      : [];


    $("issuesCounter").textContent =
      "محاولات الدخول المفتوحة: " +
      list.length;


    if (!list.length) {

      body.innerHTML =
        '<tr>' +
          '<td colspan="4" class="empty">' +
            'لا توجد محاولات دخول جديدة مفتوحة.' +
          '</td>' +
        '</tr>';

      return;
    }


    body.innerHTML = list.map(function (issue) {

      var username =
        getIssueUsername(issue);

      return (
        '<tr>' +

          '<td>' +
            escapeHtml(username) +
          '</td>' +

          '<td>' +
            escapeHtml(
              formatDate(issue.created_at)
            ) +
          '</td>' +

          '<td>' +
            '#' +
            escapeHtml(String(issue.number)) +
          '</td>' +

          '<td>' +

            '<div style="display:flex;gap:7px;flex-wrap:wrap;">' +

              '<button class="btn-success" ' +
                'onclick="allowUser(' +
                  escapeJs(username) +
                  ',' +
                  JSON.stringify(issue.number) +
                ')">' +
                'سماح' +
              '</button>' +

              '<button class="btn-danger" ' +
                'onclick="blockUser(' +
                  escapeJs(username) +
                  ',' +
                  JSON.stringify(issue.number) +
                ')">' +
                'حظر' +
              '</button>' +

            '</div>' +

          '</td>' +

        '</tr>'
      );

    }).join("");

  }


  /* =========================================================
     Refresh All
     
     Always reload both files from GitHub.
     Cache disabled + timestamp added.
  ========================================================= */

  window.refreshAll = function () {

    if (!state.connected) {

      setMsg(
        "connectionMsg",
        "قم بالاتصال أولاً.",
        "err"
      );

      return Promise.resolve();

    }


    setMsg(
      "usersMsg",
      "جارٍ تحديث المستخدمين...",
      ""
    );

    setMsg(
      "issuesMsg",
      "جارٍ تحديث محاولات الدخول...",
      ""
    );


    $("refreshBtn").disabled = true;
    $("refreshUsersBtn").disabled = true;
    $("refreshIssuesBtn").disabled = true;


    return Promise.all([
      loadUsers(),
      loadIssues()
    ])

    .then(function () {

      renderUsers();
      renderIssues(state.issues);

      setMsg(
        "usersMsg",
        "تم تحديث المستخدمين.",
        "ok"
      );

      setMsg(
        "issuesMsg",
        "",
        ""
      );

    })

    .catch(function (e) {

      setMsg(
        "usersMsg",
        "فشل التحديث: " + e.message,
        "err"
      );

      setMsg(
        "issuesMsg",
        "",
        ""
      );

    })

    .finally(function () {

      $("refreshBtn").disabled = false;
      $("refreshUsersBtn").disabled = false;
      $("refreshIssuesBtn").disabled = false;

    });

  };


  /* =========================================================
     Formatting / escaping
  ========================================================= */

  function formatDate(value) {

    if (!value) return "-";

    var d = new Date(value);

    if (isNaN(d.getTime())) {
      return String(value);
    }

    return d.toLocaleString(
      "ar-EG",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  function escapeHtml(value) {

    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return JSON.stringify(
      String(value == null ? "" : value)
    );

  }


})();
</script>

</body>
</html>
